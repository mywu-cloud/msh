name: Refresh Stock Prices (Manual)

# Manually trigger a stock price refresh. Use this if TWSE data
# was delayed and the automatic evening Cron Trigger skipped saving
# (see backend/wrangler.toml [triggers] for the daily 19:00 / 20:00
# Taiwan-time schedule already configured on the Worker).
on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/refresh-prices
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://msh-api.tw-mywu.workers.dev/api/refresh-prices)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "Response body: $body"
          if [ "$http_code" -ne 200 ]; then
            echo "Refresh request failed"
            exit 1
          fi

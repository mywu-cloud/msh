name: TDCC Weekly Scraper
on:
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:
    inputs:
      scrape_dates:
        description: '指定日期（逗號分隔 YYYYMMDD，如 20260522,20260515），留空則抓最新週'
        required: false
        default: ''
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/main.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SCRAPE_DATES: ${{ github.event.inputs.scrape_dates }}
      - run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/ || true
          git diff --staged --quiet || git commit -m "data: TDCC update ${{ github.event.inputs.scrape_dates || 'latest' }}"
          git push

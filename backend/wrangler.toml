name = "msh-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "msh-stock-db"
database_id = "cfa7a620-887c-496b-b61e-410d3f4a33c4"

# Cloudflare KV Namespace binding (cache for slow external lookups)
[[kv_namespaces]]
binding = "CACHE"
id = "a8d8c56bfae84f1eba81658a06803d39"

[vars]
ENVIRONMENT = "production"

[build]
command = "npm run build"

# Cron Triggers（UTC）:
#   平日 台灣 19:00 / 20:00：更新股價 + ISIN 代碼表，並預熱快取
#   週六 台灣 17:30：TDCC 週資料（16:00 爬蟲）上傳後預熱快取
#   ※ "30 9 * * 6" 需與 src/index.ts 的 SATURDAY_PREWARM_CRON 一致
[triggers]
crons = ["0 11 * * 1-5", "0 12 * * 1-5", "30 9 * * 6"]

# Secrets (set via: wrangler secret put FINMIND_TOKEN)
# FINMIND_TOKEN - FinMind API token for price & industry data
# Get token at: https://finmindtrade.com/

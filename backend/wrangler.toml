name = "msh-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "msh-stock-db"
database_id = "cfa7a620-887c-496b-b61e-410d3f4a33c4"

[vars]
ENVIRONMENT = "production"

[build]
command = "npm run build"

# Secrets (set via: wrangler secret put FINMIND_TOKEN)
# FINMIND_TOKEN - FinMind API token for price & industry data
# Get token at: https://finmindtrade.com/
